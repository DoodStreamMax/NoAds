<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengarahkan ke Browser...</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding-top: 50px; 
            background-color: #f8f9fa;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Styling untuk pesan peringatan iOS/In-App Browser */
        #ios-notice { 
            display: none; 
            padding: 20px; 
            background: #fff3cd; 
            color: #856404;
            border: 1px solid #ffeeba; 
            border-radius: 8px; 
            margin: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="loader" id="loader"></div>
    <h2 id="status-text">Sedang mengarahkan...</h2>

    <div id="ios-notice">
        <h3>Tautan tidak bisa dibuka otomatis di sini 🔒</h3>
        <p>Untuk melanjutkan, ketuk ikon <strong>3 titik ( ⋮ atau ⋯ )</strong> di pojok kanan/bawah layar Anda, lalu pilih:</p>
        <p><strong>🌐 "Buka di Browser Sistem" / "Open in Safari"</strong></p>
    </div>

    <script>
        function redirectOut() {
            // 1. Tentukan URL Tujuan Anda di sini
            var targetUrl = "https://website-tujuan-anda.com"; 

            var ua = navigator.userAgent || navigator.vendor || window.opera;
            
            // 2. Deteksi apakah dibuka di In-App Browser (FB, IG, Line, dll)
            var isInApp = (ua.indexOf('FBAN') > -1) || 
                          (ua.indexOf('FBAV') > -1) || 
                          (ua.indexOf('Instagram') > -1) || 
                          (ua.indexOf('Line') > -1);
            
            var isAndroid = /android/i.test(ua);

            if (isInApp) {
                if (isAndroid) {
                    // 3. Paksa buka di Chrome Android menggunakan Android Intent
                    // Hilangkan 'https://' atau 'http://' dari targetUrl untuk skema intent
                    var cleanUrl = targetUrl.replace(/^https?:\/\//, '');
                    var intentUrl = "intent://" + cleanUrl + "#Intent;scheme=https;package=com.android.chrome;end;";
                    
                    window.location.href = intentUrl;
                } else {
                    // 4. Jika di iOS atau perangkat lain, tampilkan instruksi manual
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('status-text').style.display = 'none';
                    document.getElementById('ios-notice').style.display = 'block';
                }
            } else {
                // 5. Jika sudah di browser standar (Chrome, Safari, Firefox), langsung redirect
                window.location.replace(targetUrl);
            }
        }

        // Jalankan skrip saat halaman dimuat
        window.onload = redirectOut;
    </script>
</body>
</html>
